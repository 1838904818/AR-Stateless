[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-stateless"
version = "1.0.0"
description = "Asymmetric replay with stateless retraining for class-incremental network intrusion detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.7,<1.8",
    "scipy>=1.11",
    "torch>=2.1",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["ar_stateless", "ar_stateless._raw_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ar_stateless"]
